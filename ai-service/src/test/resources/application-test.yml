spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:ai_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
eureka:
  client:
    enabled: false
ai:
  api-url: http://localhost/test
  api-key: test-ai-api-key
swagger:
  gateway-url: http://localhost:19091
