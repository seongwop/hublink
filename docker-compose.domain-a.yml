# domain-a VM 서비스 묶음
services:
  # 사용자 서비스
  user-service:
    image: ${IMAGE_REGISTRY}/hublink-user-service:${IMAGE_TAG:-latest}
    container_name: hublink-user-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19093"
    ports:
      - "19093:19093"

  # 업체 서비스
  company-service:
    image: ${IMAGE_REGISTRY}/hublink-company-service:${IMAGE_TAG:-latest}
    container_name: hublink-company-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19096"
    ports:
      - "19096:19096"

  # 허브 서비스
  hub-service:
    image: ${IMAGE_REGISTRY}/hublink-hub-service:${IMAGE_TAG:-latest}
    container_name: hublink-hub-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19095"
    ports:
      - "19095:19095"

  # 상품 서비스
  product-service:
    image: ${IMAGE_REGISTRY}/hublink-product-service:${IMAGE_TAG:-latest}
    container_name: hublink-product-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_A_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19097"
    ports:
      - "19097:19097"

  # domain-a VM Docker 로그 수집기
  promtail:
    image: grafana/promtail:latest
    container_name: hublink-promtail-domain-a
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      HUBLINK_VM_ROLE: domain-a
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

# 로그 수집 위치 저장 볼륨
volumes:
  promtail-positions:
