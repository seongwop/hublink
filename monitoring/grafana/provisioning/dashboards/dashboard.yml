apiVersion: 1

providers:
  - name: hublink-delivery-dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json

  - name: hublink-delivery-100vu-comparisons
    orgId: 1
    folder: 'Delivery Performance - 100VU · 8min'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/comparison-100vu

  - name: hublink-delivery-fixed-rps-comparisons
    orgId: 1
    folder: 'Delivery Performance - Fixed RPS · 3min Steady'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/comparison-fixed-rps
