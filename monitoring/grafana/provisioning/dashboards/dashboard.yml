apiVersion: 1

providers:
  - name: hublink-delivery-dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json

  - name: hublink-delivery-portfolio-comparisons
    orgId: 1
    folder: 'Delivery Portfolio Comparisons'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/portfolio
