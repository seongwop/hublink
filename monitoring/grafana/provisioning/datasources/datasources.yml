# Grafana 기본 datasource 설정
apiVersion: 1

# Prometheus와 Loki 자동 등록
datasources:
  # 메트릭 조회 datasource
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # 로그 조회 datasource
  - name: Loki
    uid: P8E80F9AEF21F6940
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
