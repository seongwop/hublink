global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # platform VM 서비스 메트릭
  - job_name: 'hublink-platform'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - '10.10.0.10:19091'

  # domain-a VM 서비스 메트릭
  - job_name: 'hublink-domain-a'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - '10.10.0.20:19093'
          - '10.10.0.20:19095'
          - '10.10.0.20:19096'
          - '10.10.0.20:19097'

  # domain-b VM 서비스 메트릭
  - job_name: 'hublink-domain-b'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - '10.10.0.30:19094'
          - '10.10.0.30:19098'
          - '10.10.0.30:19100'

  # 배송 전용 VM 서비스 메트릭
  - job_name: 'hublink-delivery'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - '10.10.0.70:19099'

  # AI Service 1초 수집
  - job_name: 'hublink-ai-service'
    scrape_interval: 1s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - '10.10.0.30:19101'

  # Kafka consumer lag 메트릭
  - job_name: 'hublink-kafka-exporter'
    static_configs:
      - targets:
          - 'kafka-exporter:9308'

  # PostgreSQL 메트릭
  - job_name: 'hublink-postgres-exporter'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  # data VM host 메트릭
  - job_name: 'hublink-data-node'
    static_configs:
      - targets:
          - '10.10.0.40:9100'
