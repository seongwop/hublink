# 배송 전용 VM 서비스 묶음
services:
  # 배송 서비스
  delivery-service:
    image: ${IMAGE_REGISTRY}/hublink-delivery-service:${DELIVERY_SERVICE_IMAGE_TAG:-latest}
    container_name: hublink-delivery-service
    restart: on-failure
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      SERVER_PORT: "19099"
      SPRING_CONFIG_IMPORT: configserver:${CONFIG_SERVER_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_HOSTNAME: ${DELIVERY_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DELIVERY_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19099"
    ports:
      - "19099:19099"

  # 배송 VM Docker 로그 수집기
  promtail:
    image: ${IMAGE_REGISTRY}/hublink-promtail:latest
    container_name: hublink-promtail-delivery
    restart: unless-stopped
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      HUBLINK_VM_ROLE: delivery
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

# 로그 수집 위치 저장 볼륨
volumes:
  promtail-positions:
