# 플랫폼 VM 서비스 묶음
services:
  # 서비스 디스커버리 서버
  eureka-server:
    image: ${IMAGE_REGISTRY}/hublink-eureka-server:${EUREKA_SERVER_IMAGE_TAG:-latest}
    container_name: hublink-eureka-server
    restart: on-failure
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${PLATFORM_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${PLATFORM_VM_IP}
    ports:
      - "19090:19090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Config Server
  config-server:
    image: ${IMAGE_REGISTRY}/hublink-config-server:${CONFIG_SERVER_IMAGE_TAG:-latest}
    container_name: hublink-config-server
    restart: on-failure
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      CONFIG_REPO_PATH: file:/config-repo/
      EUREKA_INSTANCE_HOSTNAME: ${PLATFORM_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${PLATFORM_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19092"
    ports:
      - "19092:19092"
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19092/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 외부 요청 진입 Gateway
  api-gateway:
    image: ${IMAGE_REGISTRY}/hublink-api-gateway:${API_GATEWAY_IMAGE_TAG:-latest}
    container_name: hublink-api-gateway
    restart: on-failure
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      SERVER_PORT: "19091"
      SPRING_CONFIG_IMPORT: configserver:${CONFIG_SERVER_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_HOSTNAME: ${PLATFORM_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${PLATFORM_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19091"
    ports:
      - "19091:19091"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # platform VM Docker 로그 수집기
  promtail:
    image: ${IMAGE_REGISTRY}/hublink-promtail:latest
    container_name: hublink-promtail-platform
    restart: unless-stopped
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      HUBLINK_VM_ROLE: platform
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

# 로그 수집 위치 저장 볼륨
volumes:
  promtail-positions:
