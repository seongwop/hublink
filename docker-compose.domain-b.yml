# domain-b VM 서비스 묶음
services:
  # 주문 서비스
  order-service:
    image: ${IMAGE_REGISTRY}/hublink-order-service:${IMAGE_TAG:-latest}
    container_name: hublink-order-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19094"
    ports:
      - "19094:19094"

  # 재고 서비스
  stock-service:
    image: ${IMAGE_REGISTRY}/hublink-stock-service:${IMAGE_TAG:-latest}
    container_name: hublink-stock-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19098"
    ports:
      - "19098:19098"

  # 배송 서비스
  delivery-service:
    image: ${IMAGE_REGISTRY}/hublink-delivery-service:${IMAGE_TAG:-latest}
    container_name: hublink-delivery-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19099"
    ports:
      - "19099:19099"

  # Slack 알림 서비스
  slack-service:
    image: ${IMAGE_REGISTRY}/hublink-slack-service:${IMAGE_TAG:-latest}
    container_name: hublink-slack-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19100"
    ports:
      - "19100:19100"

  # AI 연계 서비스
  ai-service:
    image: ${IMAGE_REGISTRY}/hublink-ai-service:${IMAGE_TAG:-latest}
    container_name: hublink-ai-service
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: ${DOMAIN_B_VM_IP}
      EUREKA_INSTANCE_NON_SECURE_PORT: "19101"
    ports:
      - "19101:19101"

  # domain-b VM Docker 로그 수집기
  promtail:
    image: ${IMAGE_REGISTRY}/hublink-promtail:latest
    container_name: hublink-promtail-domain-b
    env_file:
      - ${HUBLINK_ENV_FILE:-.env.gcp}
    environment:
      HUBLINK_VM_ROLE: domain-b
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/var/lib/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

# 로그 수집 위치 저장 볼륨
volumes:
  promtail-positions:
