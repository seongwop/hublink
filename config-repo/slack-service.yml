server:
  port: 19100

spring:
  application:
    name: slack-service

  datasource:
    url: ${DB_URL}?currentSchema=slack_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: slack_service
        format_sql: false
    show-sql: false

  task:
    scheduling:
      pool:
        size: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

slack:
  enabled: ${SLACK_ENABLED:false}
  bot-token: ${SLACK_BOT_TOKEN:}

swagger:
  gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:19091}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
