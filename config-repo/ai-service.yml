server:
  port: 19101

spring:
  application:
    name: ai-service

  datasource:
    url: ${DB_URL}?currentSchema=ai_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ai_service
        format_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

ai:
  enabled: ${AI_ENABLED:false}
  api-url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
  api-key: ${AI_API_KEY:}
  stream:
    consumer:
      deadline-requested:
        fixed-delay-ms: 3000
        read-count: 300
        concurrency: 1
        pending-retry-enabled: false
        pending-retry-fixed-delay-ms: 300000
        pending-retry-read-count: 10


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      geminiApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

swagger:
  gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:19091}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}


