server:
  port: 19099
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: delivery-service
  datasource:
    url: ${DB_URL}?currentSchema=delivery_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DELIVERY_DB_MAX_POOL_SIZE:60}
      minimum-idle: ${DELIVERY_DB_MIN_IDLE:3}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  cloud:
    openfeign:
      client:
        config:
          hub-service:
            connectTimeout: 1000
            readTimeout: 2000
          user-service:
            connectTimeout: 1000
            readTimeout: 2000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:delivery-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: delivery_service
        format_sql: false
    show-sql: false

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}

delivery:
  # Hub ID별 배송 담당자 후보 로컬 캐시
  manager-cache:
    ttl-seconds: ${DELIVERY_MANAGER_CACHE_TTL_SECONDS:60}
    maximum-hubs: ${DELIVERY_MANAGER_CACHE_MAXIMUM_HUBS:32}
  assignment:
    max-active-per-manager: ${DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER:30}
    lock-wait: ${DELIVERY_ASSIGNMENT_LOCK_WAIT:2s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 60000
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 20s
    instances:
      hub-service:
        baseConfig: default
      user-service:
        baseConfig: default

management:
  metrics:
    enable:
      tomcat: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

swagger:
  gateway-url: ${SWAGGER_GATEWAY_URL:http://localhost:19091}
