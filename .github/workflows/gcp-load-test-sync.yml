name: GCP Cloud Run Load Test

on:
  workflow_dispatch:
    inputs:
      execute_test:
        description: 배포 후 부하 테스트 실행
        required: true
        default: false
        type: boolean
      k6_script:
        description: 실행할 k6 스크립트
        required: true
        default: delivery-create-logic-load.js
        type: choice
        options:
          - delivery-create-logic-load.js
          - delivery-create-kafka-load.js
          - delivery-outbox-publish-load.js
      load_model:
        description: 부하 모델
        required: true
        default: vu
        type: choice
        options:
          - vu
          - rps
      vus:
        description: VU 모드 최대 VU
        required: true
        default: '100'
        type: string
      target_rps:
        description: RPS 모드 목표 요청 수
        required: true
        default: '40'
        type: string
      preallocated_vus:
        description: RPS 모드 사전 할당 VU
        required: true
        default: '400'
        type: string
      max_vus:
        description: RPS 모드 최대 VU
        required: true
        default: '600'
        type: string
      ramp_up:
        description: 상승 구간
        required: true
        default: 1m
        type: string
      steady:
        description: 유지 구간
        required: true
        default: 5m
        type: string
      ramp_down:
        description: 하강 구간
        required: true
        default: 2m
        type: string
      sleep_seconds:
        description: VU 요청 간격
        required: true
        default: '0'
        type: string
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/gcp-load-test-sync.yml'
      - 'performance/k6/**'
      - 'db/seed/**'

concurrency:
  group: gcp-cloud-run-load-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 저장소 checkout 권한
  contents: read
  # Workload Identity 인증 토큰 권한
  id-token: write

env:
  GCP_REGION: asia-northeast3
  GCP_ARTIFACT_REPOSITORY: hublink
  GCP_LOAD_TEST_JOB: hublink-k6-load-test
  GCP_LOAD_TEST_SERVICE_ACCOUNT: hublink-load-test
  GCP_LOAD_TEST_DB_SECRET: hublink-load-test-db-password

jobs:
  deploy:
    name: Deploy Cloud Run k6 Job
    runs-on: ubuntu-latest
    environment: gcp

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve test condition
        env:
          INPUT_K6_SCRIPT: ${{ inputs.k6_script }}
          INPUT_LOAD_MODEL: ${{ inputs.load_model }}
          INPUT_VUS: ${{ inputs.vus }}
          INPUT_TARGET_RPS: ${{ inputs.target_rps }}
          INPUT_PREALLOCATED_VUS: ${{ inputs.preallocated_vus }}
          INPUT_MAX_VUS: ${{ inputs.max_vus }}
          INPUT_RAMP_UP: ${{ inputs.ramp_up }}
          INPUT_STEADY: ${{ inputs.steady }}
          INPUT_RAMP_DOWN: ${{ inputs.ramp_down }}
          INPUT_SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: |
          echo "K6_SCRIPT=${INPUT_K6_SCRIPT:-delivery-create-logic-load.js}" >> "${GITHUB_ENV}"
          echo "K6_LOAD_MODEL=${INPUT_LOAD_MODEL:-vu}" >> "${GITHUB_ENV}"
          echo "K6_VUS=${INPUT_VUS:-100}" >> "${GITHUB_ENV}"
          echo "K6_TARGET_RPS=${INPUT_TARGET_RPS:-40}" >> "${GITHUB_ENV}"
          echo "K6_PREALLOCATED_VUS=${INPUT_PREALLOCATED_VUS:-400}" >> "${GITHUB_ENV}"
          echo "K6_MAX_VUS=${INPUT_MAX_VUS:-600}" >> "${GITHUB_ENV}"
          echo "K6_RAMP_UP=${INPUT_RAMP_UP:-1m}" >> "${GITHUB_ENV}"
          echo "K6_STEADY=${INPUT_STEADY:-5m}" >> "${GITHUB_ENV}"
          echo "K6_RAMP_DOWN=${INPUT_RAMP_DOWN:-2m}" >> "${GITHUB_ENV}"
          echo "K6_SLEEP_SECONDS=${INPUT_SLEEP_SECONDS:-0}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}" >> "${GITHUB_ENV}"
          echo "LOAD_TEST_SERVICE_ACCOUNT=${GCP_LOAD_TEST_SERVICE_ACCOUNT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com" >> "${GITHUB_ENV}"

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push k6 image
        run: |
          docker build \
            -f performance/k6/Dockerfile.cloud-run \
            -t "${IMAGE_REGISTRY}/hublink-k6:${GITHUB_SHA}" \
            .
          docker push "${IMAGE_REGISTRY}/hublink-k6:${GITHUB_SHA}"

      - name: Add DB password secret version
        run: |
          printf '%s' "${DB_PASSWORD:?DB_PASSWORD secret is required}" \
            | gcloud secrets versions add "${GCP_LOAD_TEST_DB_SECRET}" \
                --project "${GCP_PROJECT_ID}" \
                --data-file=-

      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy "${GCP_LOAD_TEST_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_REGISTRY}/hublink-k6:${GITHUB_SHA}" \
            --service-account "${LOAD_TEST_SERVICE_ACCOUNT}" \
            --execution-environment gen2 \
            --cpu 1 \
            --memory 4Gi \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 20m \
            --network hublink-vpc \
            --subnet hublink-subnet \
            --vpc-egress private-ranges-only \
            --set-secrets "RESET_DB_PASSWORD=${GCP_LOAD_TEST_DB_SECRET}:latest" \
            --set-env-vars "K6_SCRIPT=${K6_SCRIPT},K6_LOAD_MODEL=${K6_LOAD_MODEL},K6_VUS=${K6_VUS},K6_TARGET_RPS=${K6_TARGET_RPS},K6_PRE_ALLOCATED_VUS=${K6_PREALLOCATED_VUS},K6_MAX_VUS=${K6_MAX_VUS},K6_RAMP_UP=${K6_RAMP_UP},K6_STEADY=${K6_STEADY},K6_RAMP_DOWN=${K6_RAMP_DOWN},SLEEP_SECONDS=${K6_SLEEP_SECONDS}" \
            --quiet

      - name: Execute load test
        if: github.event_name == 'workflow_dispatch' && inputs.execute_test
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > cloud-run-k6-started-at.txt
          gcloud run jobs execute "${GCP_LOAD_TEST_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait

      - name: Export load test log
        if: github.event_name == 'workflow_dispatch' && inputs.execute_test && always()
        run: |
          STARTED_AT="$(cat cloud-run-k6-started-at.txt)"
          sleep 10
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${GCP_LOAD_TEST_JOB}\" AND timestamp>=\"${STARTED_AT}\"" \
            --project "${GCP_PROJECT_ID}" \
            --order asc \
            --limit 5000 \
            --format 'value(timestamp,textPayload)' \
            > cloud-run-k6.log

      - name: Upload load test log
        if: github.event_name == 'workflow_dispatch' && inputs.execute_test && always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-k6-${{ github.run_id }}
          path: |
            cloud-run-k6.log
            cloud-run-k6-started-at.txt
