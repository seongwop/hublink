name: GCP CI/CD

on:
  # 수동 배포
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: 수동 배포 범위
        required: true
        default: all
        type: choice
        options:
          - all
          - delivery-replay
      delivery_source_ref:
        description: 배송 이미지 소스 브랜치, 태그 또는 커밋 SHA
        required: false
        type: string
      delivery_outbox_fixed_delay_ms:
        description: 재현 시작 1000, 폴링 단축 이후 100
        required: true
        default: '1000'
        type: string
  # develop 배포 관련 변경 감지
  push:
    branches:
      - develop
    paths:
      - 'scripts/gcp/**'
      - 'infra/gcp/scripts/**'
      - 'Dockerfile'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'config-repo/**'
      - 'db/**'
      - 'monitoring/**'
      - 'docker-compose.*.yml'
      - 'ai-service/**'
      - 'api-gateway/**'
      - 'company-service/**'
      - 'config-server/**'
      - 'core-common/**'
      - 'delivery-service/**'
      - 'eureka-server/**'
      - 'hub-service/**'
      - 'order-service/**'
      - 'product-service/**'
      - 'slack-service/**'
      - 'stock-service/**'
      - 'user-service/**'

concurrency:
  # 같은 브랜치 중복 배포 취소
  group: gcp-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 저장소 checkout 최소 권한
  contents: read
  # GitHub OIDC 토큰 발급 권한
  id-token: write

env:
  # Terraform 리소스 기준 고정 배포 정보
  GCP_REGION: asia-northeast3
  GCP_ZONE: asia-northeast3-a
  GCP_ARTIFACT_REPOSITORY: hublink
  GCP_REMOTE_DIR: /opt/hublink
  PLATFORM_VM: hublink-platform-vm
  DOMAIN_A_VM: hublink-domain-a-vm
  DOMAIN_B_VM: hublink-domain-b-vm
  DELIVERY_VM: hublink-delivery-vm
  DATA_VM: hublink-data-vm
  PLATFORM_VM_IP: 10.10.0.10
  DOMAIN_A_VM_IP: 10.10.0.20
  DOMAIN_B_VM_IP: 10.10.0.30
  DELIVERY_VM_IP: 10.10.0.70
  DATA_VM_IP: 10.10.0.40
  MONITORING_VM_IP: 10.10.0.10

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.detect.outputs.services_json }}
      deploy_platform: ${{ steps.detect.outputs.deploy_platform }}
      deploy_domain_a: ${{ steps.detect.outputs.deploy_domain_a }}
      deploy_domain_b: ${{ steps.detect.outputs.deploy_domain_b }}
      deploy_delivery: ${{ steps.detect.outputs.deploy_delivery }}
      deploy_data: ${{ steps.detect.outputs.deploy_data }}
      mirror_promtail: ${{ steps.detect.outputs.mirror_promtail }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
      foundation_targets_json: ${{ steps.detect.outputs.foundation_targets_json }}
      app_targets_json: ${{ steps.detect.outputs.app_targets_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: files
        env:
          MANUAL_DEPLOY_SCOPE: ${{ inputs.deploy_scope }}
          DELIVERY_SOURCE_REF: ${{ inputs.delivery_source_ref }}
        run: |
          # 수동 실행 범위 처리
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${MANUAL_DEPLOY_SCOPE}" = "delivery-replay" ]; then
              if [ -z "${DELIVERY_SOURCE_REF}" ]; then
                echo "delivery_source_ref is required for delivery-replay" >&2
                exit 1
              fi
              echo "mode=delivery-replay" >> "${GITHUB_OUTPUT}"
              : > changed-files.txt
              exit 0
            fi

            echo "mode=all" >> "${GITHUB_OUTPUT}"
            git ls-files > changed-files.txt
            exit 0
          fi

          # push 기준 변경 파일 목록 생성
          before="${{ github.event.before }}"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^)"
          fi

          echo "mode=changed" >> "${GITHUB_OUTPUT}"
          git diff --name-only "${before}" "${GITHUB_SHA}" > changed-files.txt

      - name: Build deployment matrix
        id: detect
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = "${{ steps.files.outputs.mode }}"
          changed_files = [
              line.strip().replace("\\", "/")
              for line in Path("changed-files.txt").read_text().splitlines()
              if line.strip()
          ]

          service_to_role = {
              "eureka-server": "platform",
              "config-server": "platform",
              "api-gateway": "platform",
              "user-service": "domain_a",
              "company-service": "domain_a",
              "hub-service": "domain_a",
              "product-service": "domain_a",
              "order-service": "domain_b",
              "stock-service": "domain_b",
              "delivery-service": "delivery",
              "slack-service": "domain_b",
              "ai-service": "domain_b",
          }

          role_to_vm = {
              "platform": "hublink-platform-vm",
              "domain_a": "hublink-domain-a-vm",
              "domain_b": "hublink-domain-b-vm",
              "delivery": "hublink-delivery-vm",
              "data": "hublink-data-vm",
          }
          role_to_compose = {
              "platform": "docker-compose.platform-monitoring.yml",
              "domain_a": "docker-compose.domain-a.yml",
              "domain_b": "docker-compose.domain-b.yml",
              "delivery": "docker-compose.delivery.yml",
              "data": "docker-compose.data.yml",
          }
          full_extras = {
              "platform": ["docker-compose.platform.yml", "docker-compose.monitoring.yml", "config-repo", "monitoring"],
              "domain_a": ["monitoring/promtail.yml"],
              "domain_b": ["monitoring/promtail.yml"],
              "delivery": ["monitoring/promtail.yml"],
              "data": ["db"],
          }
          compose_to_role = {
              "docker-compose.platform.yml": "platform",
              "docker-compose.platform-monitoring.yml": "platform",
              "docker-compose.domain-a.yml": "domain_a",
              "docker-compose.domain-b.yml": "domain_b",
              "docker-compose.delivery.yml": "delivery",
              "docker-compose.data.yml": "data",
              "docker-compose.monitoring.yml": "platform",
          }
          mode_rank = {"sync": 0, "config": 1, "image": 2, "full": 3}

          all_services = list(service_to_role.keys())
          role_service_order = {
              role: [service for service in all_services if service_to_role[service] == role]
              for role in {"platform", "domain_a", "domain_b", "delivery"}
          }
          role_base_extras = {
              "platform": {"docker-compose.platform.yml", "docker-compose.monitoring.yml"},
          }
          services = set()
          targets = {}
          mirror_promtail = False

          def ensure_target(role):
              return targets.setdefault(role, {
                  "role": role,
                  "vm": role_to_vm[role],
                  "compose": role_to_compose[role],
                  "mode": "sync",
                  "services": set(),
                  "extras": set(role_base_extras.get(role, set())),
                  "force_recreate": False,
                  "skip_ensure": True,
              })

          def add_target(role, deploy_mode, services_to_deploy=(), extras=(), force_recreate=False, skip_ensure=True):
              target = ensure_target(role)
              if mode_rank[deploy_mode] > mode_rank[target["mode"]]:
                  target["mode"] = deploy_mode
              if deploy_mode == "full":
                  target["services"].clear()
              elif target["mode"] != "full":
                  target["services"].update(services_to_deploy)
              target["extras"].update(extras)
              target["force_recreate"] = target["force_recreate"] or force_recreate
              target["skip_ensure"] = target["skip_ensure"] and skip_ensure

          def add_full_role(role, skip_ensure=True):
              add_target(role, "full", extras=full_extras.get(role, []), skip_ensure=skip_ensure)

          def add_image_service(service):
              services.add(service)
              add_target(service_to_role[service], "image", [service])

          def add_config_service(service):
              add_target("platform", "sync", extras=["config-repo"])
              add_target(service_to_role[service], "config", [service], force_recreate=True)

          def add_all_app_services_as_image():
              for service in all_services:
                  add_image_service(service)

          def add_all_app_roles_full(skip_ensure=True):
              for role in ("platform", "domain_a", "domain_b", "delivery"):
                  add_full_role(role, skip_ensure=skip_ensure)

          if mode == "all":
              add_all_app_services_as_image()
              add_full_role("platform", skip_ensure=False)
              add_full_role("domain_a", skip_ensure=False)
              add_full_role("domain_b", skip_ensure=False)
              add_full_role("delivery", skip_ensure=False)
              add_full_role("data", skip_ensure=False)
              mirror_promtail = True
          elif mode == "delivery-replay":
              add_image_service("delivery-service")
          else:
              for file_path in changed_files:
                  for service in all_services:
                      if file_path == service or file_path.startswith(f"{service}/"):
                          add_image_service(service)

                  if (
                      file_path in {"Dockerfile", "build.gradle", "settings.gradle", "gradlew"}
                      or file_path.startswith("gradle/")
                      or file_path.startswith("core-common/")
                  ):
                      add_all_app_services_as_image()

                  if file_path.startswith("config-repo/"):
                      config_name = Path(file_path).name
                      config_service = config_name.removesuffix(".yml").removesuffix(".yaml")
                      if config_service in service_to_role:
                          add_config_service(config_service)
                      else:
                          add_target("platform", "sync", extras=["config-repo"])
                          for service in all_services:
                              add_config_service(service)

                  if file_path.startswith("db/"):
                      add_full_role("data")

                  if file_path == "monitoring/promtail.yml":
                      add_full_role("platform")
                      for role in ("domain_a", "domain_b", "delivery"):
                          add_target(role, "config", ["promtail"], extras=["monitoring/promtail.yml"], force_recreate=True)
                      mirror_promtail = True
                  elif file_path.startswith("monitoring/"):
                      add_full_role("platform")

                  if file_path in compose_to_role:
                      add_full_role(compose_to_role[file_path])
                      if file_path in {"docker-compose.platform.yml", "docker-compose.platform-monitoring.yml", "docker-compose.domain-a.yml", "docker-compose.domain-b.yml", "docker-compose.delivery.yml", "docker-compose.monitoring.yml"}:
                          mirror_promtail = True

                  if file_path.startswith("scripts/gcp/") or file_path.startswith("infra/gcp/scripts/"):
                      add_all_app_roles_full(skip_ensure=False)
                      add_full_role("data", skip_ensure=False)

          def target_to_json(role):
              target = targets[role]
              ordered_services = []
              if target["mode"] != "full":
                  ordered = role_service_order.get(role, [])
                  ordered_services = [service for service in ordered if service in target["services"]]
                  ordered_services.extend(sorted(target["services"] - set(ordered_services)))
              return {
                  "role": role,
                  "vm": target["vm"],
                  "compose": target["compose"],
                  "mode": target["mode"],
                  "services": " ".join(ordered_services),
                  "extras": " ".join(sorted(target["extras"])),
                  "force_recreate": str(target["force_recreate"]).lower(),
                  "skip_ensure": str(target["skip_ensure"]).lower(),
              }

          services_json = json.dumps([service for service in all_services if service in services])
          foundation_targets = [
              target_to_json(role)
              for role in ("data", "platform")
              if role in targets
          ]
          app_targets = [
              target_to_json(role)
              for role in ("domain_a", "domain_b", "delivery")
              if role in targets
          ]
          foundation_targets_json = json.dumps(foundation_targets)
          app_targets_json = json.dumps(app_targets)
          should_deploy = bool(targets)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"services_json={services_json}\n")
              output.write(f"deploy_platform={str('platform' in targets).lower()}\n")
              output.write(f"deploy_domain_a={str('domain_a' in targets).lower()}\n")
              output.write(f"deploy_domain_b={str('domain_b' in targets).lower()}\n")
              output.write(f"deploy_delivery={str('delivery' in targets).lower()}\n")
              output.write(f"deploy_data={str('data' in targets).lower()}\n")
              output.write(f"mirror_promtail={str(mirror_promtail).lower()}\n")
              output.write(f"should_deploy={str(should_deploy).lower()}\n")
              output.write(f"foundation_targets_json={foundation_targets_json}\n")
              output.write(f"app_targets_json={app_targets_json}\n")

          print("changed_files=", changed_files)
          print("services_json=", services_json)
          print("foundation_targets_json=", foundation_targets_json)
          print("app_targets_json=", app_targets_json)
          print("mirror_promtail=", mirror_promtail)
          PY

  build-and-push:
    name: Build and push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services_json != '[]'
    outputs:
      image_tag: ${{ steps.resolve-image-tag.outputs.image_tag }}
    env:
      # GitHub Secrets 기준 Registry 주소
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REGISTRY: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hublink

    strategy:
      fail-fast: false
      # 변경된 서비스만 이미지 빌드
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'delivery-replay' && inputs.delivery_source_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve image tag
        id: resolve-image-tag
        shell: bash
        run: echo "image_tag=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Show replay image source
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'delivery-replay'
        env:
          DELIVERY_SOURCE_REF: ${{ inputs.delivery_source_ref }}
          DELIVERY_SOURCE_SHA: ${{ steps.resolve-image-tag.outputs.image_tag }}
        run: |
          echo "delivery replay source_ref=${DELIVERY_SOURCE_REF}"
          echo "delivery replay source_sha=${DELIVERY_SOURCE_SHA}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation 인증
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        # Artifact Registry Docker 인증
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_scope != 'delivery-replay'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          # 커밋 SHA 태그와 latest 태그 동시 push
          tags: |
            ${{ env.IMAGE_REGISTRY }}/hublink-${{ matrix.service }}:${{ steps.resolve-image-tag.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/hublink-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push replay delivery image
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'delivery-replay'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/hublink-${{ matrix.service }}:${{ steps.resolve-image-tag.outputs.image_tag }}
          cache-from: type=gha,scope=delivery-replay-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=delivery-replay-${{ matrix.service }}

  mirror-external-images:
    name: Mirror external images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mirror_promtail == 'true'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REGISTRY: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hublink

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Mirror promtail image
        run: |
          for attempt in 1 2 3; do
            docker pull grafana/promtail:latest && break
            echo "promtail image pull failed. attempt=${attempt}" >&2
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
          docker tag grafana/promtail:latest "${IMAGE_REGISTRY}/hublink-promtail:latest"
          docker push "${IMAGE_REGISTRY}/hublink-promtail:latest"

  deploy:
    name: Deploy to GCP VMs
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-push
      - mirror-external-images
    if: >
      always()
      && needs.detect-changes.outputs.should_deploy == 'true'
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
      && (needs.mirror-external-images.result == 'success' || needs.mirror-external-images.result == 'skipped')
    environment: gcp

    env:
      # 민감값 GitHub Secrets/Variables 주입
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      SWAGGER_GATEWAY_URL: ${{ secrets.SWAGGER_GATEWAY_URL }}
      SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
      AI_ENABLED: ${{ vars.AI_ENABLED }}
      KAKAO_ENABLED: ${{ vars.KAKAO_ENABLED }}
      LOG_LEVEL_ROOT: ${{ vars.LOG_LEVEL_ROOT }}
      DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER: ${{ vars.DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER }}
      DELIVERY_DB_MAX_POOL_SIZE: ${{ vars.DELIVERY_DB_MAX_POOL_SIZE }}
      DELIVERY_OUTBOX_FIXED_DELAY_MS: ${{ inputs.deploy_scope == 'delivery-replay' && inputs.delivery_outbox_fixed_delay_ms || vars.DELIVERY_OUTBOX_FIXED_DELAY_MS }}
      BUILD_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation 인증
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set deployment defaults
        run: |
          echo "IMAGE_REGISTRY=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}" >> "${GITHUB_ENV}"
          echo "GCP_VM_USER=${GCP_VM_USER:-github-actions}" >> "${GITHUB_ENV}"

      - name: Create .env.gcp
        run: |
          # runner 임시 환경파일 생성
          DB_USERNAME="${DB_USERNAME:-user}"
          DB_PASSWORD="${DB_PASSWORD:?DB_PASSWORD secret is required}"
          JWT_SECRET="${JWT_SECRET:?JWT_SECRET secret is required}"
          SLACK_ENABLED="${SLACK_ENABLED:-false}"
          AI_ENABLED="${AI_ENABLED:-false}"
          KAKAO_ENABLED="${KAKAO_ENABLED:-false}"
          DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER="${DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER:-60}"
          DELIVERY_DB_MAX_POOL_SIZE="${DELIVERY_DB_MAX_POOL_SIZE:-60}"
          DELIVERY_OUTBOX_FIXED_DELAY_MS="${DELIVERY_OUTBOX_FIXED_DELAY_MS:-100}"

          # platform 외부 IP 조회
          PLATFORM_VM_EXTERNAL_IP="$(gcloud compute instances describe "${PLATFORM_VM}" --zone "${GCP_ZONE}" --project "${GCP_PROJECT_ID}" --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          if [ -z "${PLATFORM_VM_EXTERNAL_IP}" ]; then
            echo "platform VM external IP is required" >&2
            exit 1
          fi

          SWAGGER_GATEWAY_URL="${SWAGGER_GATEWAY_URL:-http://${PLATFORM_VM_EXTERNAL_IP}:19091}"
          CORS_ALLOWED_ORIGIN="${CORS_ALLOWED_ORIGIN:-${SWAGGER_GATEWAY_URL}}"
          LOG_LEVEL_ROOT="${LOG_LEVEL_ROOT:-WARN}"

          cat > .env.gcp <<EOF
          IMAGE_REGISTRY=${IMAGE_REGISTRY}
          IMAGE_TAG=latest
          HUBLINK_ENV_FILE=.env.gcp

          PLATFORM_VM_IP=${PLATFORM_VM_IP}
          DOMAIN_A_VM_IP=${DOMAIN_A_VM_IP}
          DOMAIN_B_VM_IP=${DOMAIN_B_VM_IP}
          DELIVERY_VM_IP=${DELIVERY_VM_IP}
          DATA_VM_IP=${DATA_VM_IP}
          MONITORING_VM_IP=${MONITORING_VM_IP}

          DB_URL=jdbc:postgresql://${DATA_VM_IP}:5432/hublink
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}

          REDIS_HOST=${DATA_VM_IP}
          REDIS_PORT=6379
          REDIS_PASSWORD=

          KAFKA_BOOTSTRAP_SERVERS=${DATA_VM_IP}:9092

          EUREKA_URL=http://${PLATFORM_VM_IP}:19090/eureka/
          CONFIG_SERVER_URL=http://${PLATFORM_VM_IP}:19092

          SWAGGER_GATEWAY_URL=${SWAGGER_GATEWAY_URL}
          ZIPKIN_URL=http://${MONITORING_VM_IP}:9411/api/v2/spans

          SLACK_ENABLED=${SLACK_ENABLED}
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}

          AI_ENABLED=${AI_ENABLED}
          AI_API_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
          AI_API_KEY=${AI_API_KEY}

          KAKAO_ENABLED=${KAKAO_ENABLED}
          KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}

          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}

          LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT}
          DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER=${DELIVERY_ASSIGNMENT_MAX_ACTIVE_PER_MANAGER}
          DELIVERY_DB_MAX_POOL_SIZE=${DELIVERY_DB_MAX_POOL_SIZE}
          DELIVERY_OUTBOX_FIXED_DELAY_MS=${DELIVERY_OUTBOX_FIXED_DELAY_MS}
          EOF

          # heredoc 들여쓰기 공백 제거
          sed -i 's/^          //' .env.gcp

          SERVICES_JSON='${{ needs.detect-changes.outputs.services_json }}'
          export SERVICES_JSON
          python - <<'PY' >> .env.gcp
          import json
          import os

          services = [
              "eureka-server",
              "config-server",
              "api-gateway",
              "user-service",
              "company-service",
              "hub-service",
              "product-service",
              "order-service",
              "stock-service",
              "delivery-service",
              "slack-service",
              "ai-service",
          ]
          built_services = set(json.loads(os.environ.get("SERVICES_JSON") or "[]"))
          image_tag = os.environ.get("BUILD_IMAGE_TAG") or os.environ["GITHUB_SHA"]
          for service in services:
              variable = service.upper().replace("-", "_") + "_IMAGE_TAG"
              tag = image_tag if service in built_services else "latest"
              print(f"{variable}={tag}")
          PY

      - name: Prepare deploy script
        run: |
          chmod +x scripts/gcp/deploy-vm.sh
          mkdir -p "${HOME}/.ssh"
          if [ ! -f "${HOME}/.ssh/google_compute_engine" ]; then
            ssh-keygen -t rsa -b 3072 -N "" -C "github-actions@${HOSTNAME}" -f "${HOME}/.ssh/google_compute_engine" -q
          fi
          chmod 600 "${HOME}/.ssh/google_compute_engine"
          chmod 644 "${HOME}/.ssh/google_compute_engine.pub"

      - name: Deploy foundation targets
        if: needs.detect-changes.outputs.foundation_targets_json != '[]'
        env:
          DEPLOY_TARGETS_JSON: ${{ needs.detect-changes.outputs.foundation_targets_json }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          targets = json.loads(os.environ["DEPLOY_TARGETS_JSON"])

          def deploy(target):
              env = os.environ.copy()
              env["DEPLOY_MODE"] = target["mode"]
              env["DEPLOY_SERVICES"] = target.get("services", "")
              env["DEPLOY_FORCE_RECREATE"] = target.get("force_recreate", "false")
              env["DEPLOY_SKIP_DOCKER_ENSURE"] = target.get("skip_ensure", "true")

              command = ["scripts/gcp/deploy-vm.sh", target["vm"], target["compose"]]
              extras = target.get("extras", "")
              if extras:
                  command.extend(extras.split())

              print(f"deploy target={target['role']} mode={target['mode']} services={target.get('services', '')}", flush=True)
              result = subprocess.run(command, env=env)
              return target, result.returncode

          for target in targets:
              target, code = deploy(target)
              if code != 0:
                  print(f"deploy failure={(target['role'], code)}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Deploy app targets
        if: needs.detect-changes.outputs.app_targets_json != '[]'
        env:
          DEPLOY_TARGETS_JSON: ${{ needs.detect-changes.outputs.app_targets_json }}
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import subprocess
          import sys

          targets = json.loads(os.environ["DEPLOY_TARGETS_JSON"])

          def deploy(target):
              env = os.environ.copy()
              env["DEPLOY_MODE"] = target["mode"]
              env["DEPLOY_SERVICES"] = target.get("services", "")
              env["DEPLOY_FORCE_RECREATE"] = target.get("force_recreate", "false")
              env["DEPLOY_SKIP_DOCKER_ENSURE"] = target.get("skip_ensure", "true")

              command = ["scripts/gcp/deploy-vm.sh", target["vm"], target["compose"]]
              extras = target.get("extras", "")
              if extras:
                  command.extend(extras.split())

              print(f"deploy target={target['role']} mode={target['mode']} services={target.get('services', '')}", flush=True)
              result = subprocess.run(command, env=env)
              return target, result.returncode

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, len(targets))) as executor:
              futures = [executor.submit(deploy, target) for target in targets]
              for future in concurrent.futures.as_completed(futures):
                  target, code = future.result()
                  if code != 0:
                      failures.append((target["role"], code))

          if failures:
              print(f"deploy failures={failures}", file=sys.stderr)
              sys.exit(1)
          PY


