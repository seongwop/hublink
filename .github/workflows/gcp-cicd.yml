name: GCP CI/CD

on:
  # 수동 전체 배포
  workflow_dispatch:
  # develop 배포 관련 변경 감지
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/gcp-cicd.yml'
      - 'scripts/gcp/**'
      - 'infra/gcp/scripts/**'
      - 'Dockerfile'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'config-repo/**'
      - 'db/**'
      - 'monitoring/**'
      - 'docker-compose.*.yml'
      - 'ai-service/**'
      - 'api-gateway/**'
      - 'company-service/**'
      - 'config-server/**'
      - 'core-common/**'
      - 'delivery-service/**'
      - 'eureka-server/**'
      - 'hub-service/**'
      - 'order-service/**'
      - 'product-service/**'
      - 'slack-service/**'
      - 'stock-service/**'
      - 'user-service/**'

concurrency:
  # 같은 브랜치 중복 배포 취소
  group: gcp-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 저장소 checkout 최소 권한
  contents: read
  # GitHub OIDC 토큰 발급 권한
  id-token: write

env:
  # Terraform 리소스 기준 고정 배포 정보
  GCP_REGION: asia-northeast3
  GCP_ZONE: asia-northeast3-a
  GCP_ARTIFACT_REPOSITORY: hublink
  GCP_REMOTE_DIR: /opt/hublink
  PLATFORM_VM: hublink-platform-vm
  DOMAIN_A_VM: hublink-domain-a-vm
  DOMAIN_B_VM: hublink-domain-b-vm
  DATA_VM: hublink-data-vm
  MONITORING_VM: hublink-monitoring-vm
  PLATFORM_VM_IP: 10.10.0.10
  DOMAIN_A_VM_IP: 10.10.0.20
  DOMAIN_B_VM_IP: 10.10.0.30
  DATA_VM_IP: 10.10.0.40
  MONITORING_VM_IP: 10.10.0.60

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.detect.outputs.services_json }}
      deploy_platform: ${{ steps.detect.outputs.deploy_platform }}
      deploy_domain_a: ${{ steps.detect.outputs.deploy_domain_a }}
      deploy_domain_b: ${{ steps.detect.outputs.deploy_domain_b }}
      deploy_data: ${{ steps.detect.outputs.deploy_data }}
      deploy_monitoring: ${{ steps.detect.outputs.deploy_monitoring }}
      mirror_promtail: ${{ steps.detect.outputs.mirror_promtail }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: files
        run: |
          # 수동 실행은 전체 배포 대상으로 처리
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=all" >> "${GITHUB_OUTPUT}"
            git ls-files > changed-files.txt
            exit 0
          fi

          # push 기준 변경 파일 목록 생성
          before="${{ github.event.before }}"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^)"
          fi

          echo "mode=changed" >> "${GITHUB_OUTPUT}"
          git diff --name-only "${before}" "${GITHUB_SHA}" > changed-files.txt

      - name: Build deployment matrix
        id: detect
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = "${{ steps.files.outputs.mode }}"
          changed_files = [
              line.strip().replace("\\", "/")
              for line in Path("changed-files.txt").read_text().splitlines()
              if line.strip()
          ]

          service_to_vm = {
              "eureka-server": "platform",
              "config-server": "platform",
              "api-gateway": "platform",
              "user-service": "domain_a",
              "company-service": "domain_a",
              "hub-service": "domain_a",
              "product-service": "domain_a",
              "order-service": "domain_b",
              "stock-service": "domain_b",
              "delivery-service": "domain_b",
              "slack-service": "domain_b",
              "ai-service": "domain_b",
          }

          all_services = list(service_to_vm.keys())
          services = set()
          deploy = {
              "platform": False,
              "domain_a": False,
              "domain_b": False,
              "data": False,
              "monitoring": False,
          }
          mirror_promtail = False

          def deploy_service_vm(service):
              vm = service_to_vm[service]
              deploy[vm] = True

          def deploy_all_app_vms():
              deploy["platform"] = True
              deploy["domain_a"] = True
              deploy["domain_b"] = True

          if mode == "all":
              services.update(all_services)
              deploy_all_app_vms()
              deploy["data"] = True
              deploy["monitoring"] = True
              mirror_promtail = True
          else:
              for file_path in changed_files:
                  for service in all_services:
                      if file_path == service or file_path.startswith(f"{service}/"):
                          services.add(service)
                          deploy_service_vm(service)

                  if (
                      file_path in {"Dockerfile", "build.gradle", "settings.gradle", "gradlew"}
                      or file_path.startswith("gradle/")
                      or file_path.startswith("core-common/")
                  ):
                      services.update(all_services)
                      deploy_all_app_vms()

                  if file_path.startswith("config-repo/"):
                      deploy_all_app_vms()

                  if file_path.startswith("db/"):
                      deploy["data"] = True

                  if file_path == "monitoring/promtail.yml":
                      deploy_all_app_vms()
                      deploy["monitoring"] = True
                      mirror_promtail = True
                  elif file_path.startswith("monitoring/"):
                      deploy["monitoring"] = True

                  if file_path == "docker-compose.platform.yml":
                      deploy["platform"] = True

                  if file_path == "docker-compose.domain-a.yml":
                      deploy["domain_a"] = True

                  if file_path == "docker-compose.domain-b.yml":
                      deploy["domain_b"] = True

                  if file_path == "docker-compose.data.yml":
                      deploy["data"] = True

                  if file_path == "docker-compose.monitoring.yml":
                      deploy["monitoring"] = True
                      mirror_promtail = True

                  if file_path.startswith("scripts/gcp/") or file_path.startswith("infra/gcp/scripts/") or file_path == ".github/workflows/gcp-cicd.yml":
                      services.update(all_services)
                      deploy_all_app_vms()
                      deploy["data"] = True
                      deploy["monitoring"] = True

          mirror_promtail = mirror_promtail or deploy["platform"] or deploy["domain_a"] or deploy["domain_b"] or deploy["monitoring"]

          services_json = json.dumps([service for service in all_services if service in services])
          should_deploy = any(deploy.values())

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"services_json={services_json}\n")
              output.write(f"deploy_platform={str(deploy['platform']).lower()}\n")
              output.write(f"deploy_domain_a={str(deploy['domain_a']).lower()}\n")
              output.write(f"deploy_domain_b={str(deploy['domain_b']).lower()}\n")
              output.write(f"deploy_data={str(deploy['data']).lower()}\n")
              output.write(f"deploy_monitoring={str(deploy['monitoring']).lower()}\n")
              output.write(f"mirror_promtail={str(mirror_promtail).lower()}\n")
              output.write(f"should_deploy={str(should_deploy).lower()}\n")

          print("changed_files=", changed_files)
          print("services_json=", services_json)
          print("deploy=", deploy)
          print("mirror_promtail=", mirror_promtail)
          PY

  build-and-push:
    name: Build and push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services_json != '[]'
    env:
      # GitHub Secrets 기준 Registry 주소
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REGISTRY: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hublink

    strategy:
      fail-fast: false
      # 변경된 서비스만 이미지 빌드
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation 인증
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        # Artifact Registry Docker 인증
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          # 커밋 SHA 태그와 latest 태그 동시 push
          tags: |
            ${{ env.IMAGE_REGISTRY }}/hublink-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/hublink-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  mirror-external-images:
    name: Mirror external images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mirror_promtail == 'true'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_REGISTRY: asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hublink

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Mirror promtail image
        run: |
          for attempt in 1 2 3; do
            docker pull grafana/promtail:latest && break
            echo "promtail image pull failed. attempt=${attempt}" >&2
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
          docker tag grafana/promtail:latest "${IMAGE_REGISTRY}/hublink-promtail:latest"
          docker push "${IMAGE_REGISTRY}/hublink-promtail:latest"

  deploy:
    name: Deploy to GCP VMs
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-push
      - mirror-external-images
    if: >
      always()
      && needs.detect-changes.outputs.should_deploy == 'true'
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
      && (needs.mirror-external-images.result == 'success' || needs.mirror-external-images.result == 'skipped')
    environment: gcp

    env:
      # 민감값 GitHub Secrets/Variables 주입
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      SWAGGER_GATEWAY_URL: ${{ secrets.SWAGGER_GATEWAY_URL }}
      SLACK_ENABLED: ${{ vars.SLACK_ENABLED }}
      AI_ENABLED: ${{ vars.AI_ENABLED }}
      KAKAO_ENABLED: ${{ vars.KAKAO_ENABLED }}
      LOG_LEVEL_ROOT: ${{ vars.LOG_LEVEL_ROOT }}
      DELIVERY_DB_MAX_POOL_SIZE: ${{ vars.DELIVERY_DB_MAX_POOL_SIZE }}
      DELIVERY_DB_MIN_IDLE: ${{ vars.DELIVERY_DB_MIN_IDLE }}
      HUB_DB_MAX_POOL_SIZE: ${{ vars.HUB_DB_MAX_POOL_SIZE }}
      HUB_DB_MIN_IDLE: ${{ vars.HUB_DB_MIN_IDLE }}
      USER_DB_MAX_POOL_SIZE: ${{ vars.USER_DB_MAX_POOL_SIZE }}
      USER_DB_MIN_IDLE: ${{ vars.USER_DB_MIN_IDLE }}
      COMPANY_DB_MAX_POOL_SIZE: ${{ vars.COMPANY_DB_MAX_POOL_SIZE }}
      COMPANY_DB_MIN_IDLE: ${{ vars.COMPANY_DB_MIN_IDLE }}
      PRODUCT_DB_MAX_POOL_SIZE: ${{ vars.PRODUCT_DB_MAX_POOL_SIZE }}
      PRODUCT_DB_MIN_IDLE: ${{ vars.PRODUCT_DB_MIN_IDLE }}
      ORDER_DB_MAX_POOL_SIZE: ${{ vars.ORDER_DB_MAX_POOL_SIZE }}
      ORDER_DB_MIN_IDLE: ${{ vars.ORDER_DB_MIN_IDLE }}
      STOCK_DB_MAX_POOL_SIZE: ${{ vars.STOCK_DB_MAX_POOL_SIZE }}
      STOCK_DB_MIN_IDLE: ${{ vars.STOCK_DB_MIN_IDLE }}
      SLACK_DB_MAX_POOL_SIZE: ${{ vars.SLACK_DB_MAX_POOL_SIZE }}
      SLACK_DB_MIN_IDLE: ${{ vars.SLACK_DB_MIN_IDLE }}
      AI_DB_MAX_POOL_SIZE: ${{ vars.AI_DB_MAX_POOL_SIZE }}
      AI_DB_MIN_IDLE: ${{ vars.AI_DB_MIN_IDLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation 인증
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set deployment defaults
        run: |
          echo "IMAGE_REGISTRY=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}" >> "${GITHUB_ENV}"
          echo "GCP_VM_USER=${GCP_VM_USER:-github-actions}" >> "${GITHUB_ENV}"

      - name: Create .env.gcp
        run: |
          # runner 임시 환경파일 생성
          DB_USERNAME="${DB_USERNAME:-user}"
          DB_PASSWORD="${DB_PASSWORD:?DB_PASSWORD secret is required}"
          JWT_SECRET="${JWT_SECRET:?JWT_SECRET secret is required}"
          SLACK_ENABLED="${SLACK_ENABLED:-false}"
          AI_ENABLED="${AI_ENABLED:-false}"
          KAKAO_ENABLED="${KAKAO_ENABLED:-false}"

          # platform 외부 IP 조회
          PLATFORM_VM_EXTERNAL_IP="$(gcloud compute instances describe "${PLATFORM_VM}" --zone "${GCP_ZONE}" --project "${GCP_PROJECT_ID}" --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          if [ -z "${PLATFORM_VM_EXTERNAL_IP}" ]; then
            echo "platform VM external IP is required" >&2
            exit 1
          fi

          SWAGGER_GATEWAY_URL="${SWAGGER_GATEWAY_URL:-http://${PLATFORM_VM_EXTERNAL_IP}:19091}"
          CORS_ALLOWED_ORIGIN="${CORS_ALLOWED_ORIGIN:-${SWAGGER_GATEWAY_URL}}"
          LOG_LEVEL_ROOT="${LOG_LEVEL_ROOT:-WARN}"
          DELIVERY_DB_MAX_POOL_SIZE="${DELIVERY_DB_MAX_POOL_SIZE:-20}"
          DELIVERY_DB_MIN_IDLE="${DELIVERY_DB_MIN_IDLE:-3}"
          HUB_DB_MAX_POOL_SIZE="${HUB_DB_MAX_POOL_SIZE:-10}"
          HUB_DB_MIN_IDLE="${HUB_DB_MIN_IDLE:-2}"
          USER_DB_MAX_POOL_SIZE="${USER_DB_MAX_POOL_SIZE:-10}"
          USER_DB_MIN_IDLE="${USER_DB_MIN_IDLE:-2}"
          COMPANY_DB_MAX_POOL_SIZE="${COMPANY_DB_MAX_POOL_SIZE:-10}"
          COMPANY_DB_MIN_IDLE="${COMPANY_DB_MIN_IDLE:-2}"
          PRODUCT_DB_MAX_POOL_SIZE="${PRODUCT_DB_MAX_POOL_SIZE:-5}"
          PRODUCT_DB_MIN_IDLE="${PRODUCT_DB_MIN_IDLE:-1}"
          ORDER_DB_MAX_POOL_SIZE="${ORDER_DB_MAX_POOL_SIZE:-5}"
          ORDER_DB_MIN_IDLE="${ORDER_DB_MIN_IDLE:-1}"
          STOCK_DB_MAX_POOL_SIZE="${STOCK_DB_MAX_POOL_SIZE:-5}"
          STOCK_DB_MIN_IDLE="${STOCK_DB_MIN_IDLE:-1}"
          SLACK_DB_MAX_POOL_SIZE="${SLACK_DB_MAX_POOL_SIZE:-3}"
          SLACK_DB_MIN_IDLE="${SLACK_DB_MIN_IDLE:-1}"
          AI_DB_MAX_POOL_SIZE="${AI_DB_MAX_POOL_SIZE:-3}"
          AI_DB_MIN_IDLE="${AI_DB_MIN_IDLE:-1}"

          cat > .env.gcp <<EOF
          IMAGE_REGISTRY=${IMAGE_REGISTRY}
          IMAGE_TAG=latest
          HUBLINK_ENV_FILE=.env.gcp

          PLATFORM_VM_IP=${PLATFORM_VM_IP}
          DOMAIN_A_VM_IP=${DOMAIN_A_VM_IP}
          DOMAIN_B_VM_IP=${DOMAIN_B_VM_IP}
          DATA_VM_IP=${DATA_VM_IP}
          MONITORING_VM_IP=${MONITORING_VM_IP}

          DB_URL=jdbc:postgresql://${DATA_VM_IP}:5432/hublink
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          DELIVERY_DB_MAX_POOL_SIZE=${DELIVERY_DB_MAX_POOL_SIZE}
          DELIVERY_DB_MIN_IDLE=${DELIVERY_DB_MIN_IDLE}
          HUB_DB_MAX_POOL_SIZE=${HUB_DB_MAX_POOL_SIZE}
          HUB_DB_MIN_IDLE=${HUB_DB_MIN_IDLE}
          USER_DB_MAX_POOL_SIZE=${USER_DB_MAX_POOL_SIZE}
          USER_DB_MIN_IDLE=${USER_DB_MIN_IDLE}
          COMPANY_DB_MAX_POOL_SIZE=${COMPANY_DB_MAX_POOL_SIZE}
          COMPANY_DB_MIN_IDLE=${COMPANY_DB_MIN_IDLE}
          PRODUCT_DB_MAX_POOL_SIZE=${PRODUCT_DB_MAX_POOL_SIZE}
          PRODUCT_DB_MIN_IDLE=${PRODUCT_DB_MIN_IDLE}
          ORDER_DB_MAX_POOL_SIZE=${ORDER_DB_MAX_POOL_SIZE}
          ORDER_DB_MIN_IDLE=${ORDER_DB_MIN_IDLE}
          STOCK_DB_MAX_POOL_SIZE=${STOCK_DB_MAX_POOL_SIZE}
          STOCK_DB_MIN_IDLE=${STOCK_DB_MIN_IDLE}
          SLACK_DB_MAX_POOL_SIZE=${SLACK_DB_MAX_POOL_SIZE}
          SLACK_DB_MIN_IDLE=${SLACK_DB_MIN_IDLE}
          AI_DB_MAX_POOL_SIZE=${AI_DB_MAX_POOL_SIZE}
          AI_DB_MIN_IDLE=${AI_DB_MIN_IDLE}

          REDIS_HOST=${DATA_VM_IP}
          REDIS_PORT=6379
          REDIS_PASSWORD=

          KAFKA_BOOTSTRAP_SERVERS=${DATA_VM_IP}:9092

          EUREKA_URL=http://${PLATFORM_VM_IP}:19090/eureka/
          CONFIG_SERVER_URL=http://${PLATFORM_VM_IP}:19092

          SWAGGER_GATEWAY_URL=${SWAGGER_GATEWAY_URL}
          ZIPKIN_URL=http://${MONITORING_VM_IP}:9411/api/v2/spans

          SLACK_ENABLED=${SLACK_ENABLED}
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}

          AI_ENABLED=${AI_ENABLED}
          AI_API_URL=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
          AI_API_KEY=${AI_API_KEY}

          KAKAO_ENABLED=${KAKAO_ENABLED}
          KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}

          JWT_SECRET=${JWT_SECRET}
          CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}

          LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT}
          EOF

          # heredoc 들여쓰기 공백 제거
          sed -i 's/^          //' .env.gcp

      - name: Check gcloud access
        # VM 목록 조회 권한 확인
        run: |
          gcloud compute instances list \
            --project "${GCP_PROJECT_ID}" \
            --filter="name~'hublink-.*-vm'" \
            --format="table(name,status,networkInterfaces[0].networkIP,networkInterfaces[0].accessConfigs[0].natIP)"

      - name: Prepare deploy script
        run: chmod +x scripts/gcp/deploy-vm.sh

      - name: Deploy data services
        # 데이터 저장소와 메시지 브로커 배포
        if: needs.detect-changes.outputs.deploy_data == 'true'
        run: scripts/gcp/deploy-vm.sh "${DATA_VM}" docker-compose.data.yml db

      - name: Deploy monitoring services
        # 모니터링 계층 배포
        if: needs.detect-changes.outputs.deploy_monitoring == 'true'
        run: scripts/gcp/deploy-vm.sh "${MONITORING_VM}" docker-compose.monitoring.yml monitoring

      - name: Deploy platform services
        # Eureka, Config Server, Gateway 배포
        if: needs.detect-changes.outputs.deploy_platform == 'true'
        run: scripts/gcp/deploy-vm.sh "${PLATFORM_VM}" docker-compose.platform.yml config-repo monitoring

      - name: Deploy domain A services
        # 사용자, 업체, 허브, 상품 서비스 배포
        if: needs.detect-changes.outputs.deploy_domain_a == 'true'
        run: scripts/gcp/deploy-vm.sh "${DOMAIN_A_VM}" docker-compose.domain-a.yml monitoring

      - name: Deploy domain B services
        # 주문, 재고, 배송, Slack, AI 서비스 배포
        if: needs.detect-changes.outputs.deploy_domain_b == 'true'
        run: scripts/gcp/deploy-vm.sh "${DOMAIN_B_VM}" docker-compose.domain-b.yml monitoring

      - name: Show service registry hints
        run: |
          echo "Eureka: http://<platform-external-ip>:19090"
          echo "Gateway: http://<platform-external-ip>:19091"
          echo "Grafana: http://<monitoring-external-ip>:3000"
          echo "Prometheus: http://<monitoring-external-ip>:9090"
